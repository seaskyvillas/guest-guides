<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Villa 15 Ottawa — House Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0f1320;
    --navy-900:#161c2e;
    --navy-800:#1e2740;
    --navy-700:#2a3455;
    --gold:#c9a26a;
    --gold-soft:#e4cea0;
    --cream:#f3ede1;
    --muted:#9aa2c0;
    --danger:#d97a6a;
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--navy-950);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}

  a{color:var(--gold-soft);}

  .wrap{max-width:640px;margin:0 auto;padding:0 0 64px;}

  .hero{
    position:relative;
    padding:56px 24px 40px;
    text-align:center;
    background:
      radial-gradient(120% 90% at 50% -10%, #253258 0%, var(--navy-950) 65%);
    border-bottom:1px solid var(--navy-800);
    overflow:hidden;
  }
  .hero svg{display:block;margin:0 auto 18px;width:120px;height:120px;opacity:.95;}
  .logo-card{
    display:inline-block;
    background:var(--cream);
    border-radius:12px;
    padding:16px 26px;
    margin:0 0 22px;
  }
  .logo-card svg{width:170px;height:auto;margin:0;display:block;}
  .hero .eyebrow{
    font-size:13px;
    letter-spacing:.04em;
    color:var(--muted);
    margin:0 0 6px;
  }
  .hero h1{
    font-size:clamp(30px,7vw,40px);
    font-weight:500;
    margin:0 0 10px;
    color:var(--cream);
  }
  .hero p{
    max-width:44ch;
    margin:0 auto;
    color:var(--muted);
    font-size:15px;
  }

  .quickgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--navy-800);
    border-top:1px solid var(--navy-800);
    border-bottom:1px solid var(--navy-800);
  }
  .quickcard{
    background:var(--navy-900);
    padding:18px 20px;
  }
  .quickcard .label{
    font-size:11px;
    letter-spacing:.06em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .quickcard .value{
    font-size:15px;
    font-weight:600;
    color:var(--cream);
    word-break:break-word;
  }
  .quickcard a.tel{color:var(--gold-soft);text-decoration:none;}
  .quickcard .value small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px;}

  .nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:16px 20px;
    -ms-overflow-style:none;
    scrollbar-width:none;
    position:sticky;
    top:0;
    background:rgba(15,19,32,.92);
    backdrop-filter:blur(6px);
    z-index:5;
    border-bottom:1px solid var(--navy-800);
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav a{
    flex:0 0 auto;
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
    padding:7px 13px;
    border:1px solid var(--navy-700);
    border-radius:999px;
    white-space:nowrap;
  }
  .nav a:active{background:var(--navy-800);color:var(--gold-soft);}

  .group{
    padding:8px 20px 0;
    scroll-margin-top:64px;
  }
  .group-title{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:34px 0 12px;
  }
  .group-title h2{
    font-size:20px;
    font-weight:500;
    margin:0;
    color:var(--gold-soft);
  }
  .group-title .rule{flex:1;height:1px;background:var(--navy-800);}

  details.item{
    background:var(--navy-900);
    border:1px solid var(--navy-800);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  details.item + details.item{margin-top:10px;}
  details.item summary{
    list-style:none;
    cursor:pointer;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-weight:500;
    font-size:15px;
    color:var(--cream);
  }
  details.item summary::-webkit-details-marker{display:none;}
  details.item summary .chev{
    flex:0 0 auto;
    width:20px;height:20px;
    color:var(--gold);
    transition:transform .2s ease;
  }
  details.item[open] summary .chev{transform:rotate(45deg);}
  .item-body{
    padding:0 18px 18px;
    color:#dcdce8;
    font-size:14.5px;
  }
  .item-body p{margin:0 0 10px;}
  .item-body ul, .item-body ol{margin:0 0 10px;padding-left:20px;}
  .item-body li{margin-bottom:5px;}
  .item-body h4{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    letter-spacing:.03em;
    color:var(--gold-soft);
    margin:14px 0 6px;
    text-transform:uppercase;
  }
  .item-body h4:first-child{margin-top:0;}
  .item-body .warn{
    background:rgba(217,122,106,.12);
    border:1px solid rgba(217,122,106,.35);
    color:var(--gold-soft);
    padding:10px 12px;
    border-radius:10px;
    font-size:13.5px;
    margin:10px 0;
  }
  .item-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;}
  .item-body td{padding:6px 8px;border-bottom:1px solid var(--navy-800);}
  .item-body td:first-child{color:var(--gold-soft);white-space:nowrap;}

  .item-body .photos{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin:4px 0 14px;
    padding-bottom:2px;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .item-body .photos::-webkit-scrollbar{display:none;}
  .item-body .photos img{
    height:150px;
    width:auto;
    flex:0 0 auto;
    border-radius:10px;
    object-fit:cover;
    border:1px solid var(--navy-800);
    background:var(--navy-800);
  }
  .item-body .photos.single img{height:190px;}
  .hero-photo{
    display:block;
    width:100%;
    max-width:100%;
    height:auto;
    border-radius:var(--radius);
    margin:22px 0 0;
  }

  .emergency{
    background:var(--navy-900);
    border:1px solid var(--navy-800);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:10px;
  }
  .emergency .row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid var(--navy-800);
    font-size:14px;
  }
  .emergency .row:last-child{border-bottom:none;}
  .emergency .row span:first-child{color:var(--muted);}
  .emergency .row a{text-decoration:none;font-weight:600;}

  footer{
    text-align:center;
    padding:36px 24px 10px;
    color:var(--muted);
    font-size:12.5px;
  }
</style>
</head>

<p>I acknowledge and agree to all the clauses herein and understand
that any violation of these terms may result in immediate eviction.</p>`
      }
    ]
  }
];

const nav = document.getElementById("quickNav");
const contentEl = document.getElementById("content");

SECTIONS.forEach(group => {
  const a = document.createElement("a");
  a.href = `#${group.id}`;
  a.textContent = group.title;
  nav.appendChild(a);

  const groupEl = document.createElement("div");
  groupEl.className = "group";
  groupEl.id = group.id;

  const titleEl = document.createElement("div");
  titleEl.className = "group-title";
  titleEl.innerHTML = `<h2>${group.title}</h2><div class="rule"></div>`;
  groupEl.appendChild(titleEl);

  group.items.forEach(item => {
    const details = document.createElement("details");
    details.className = "item";
    details.innerHTML = `
      <summary>${item.title}
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </summary>
      <div class="item-body">${item.body}</div>
    `;
    groupEl.appendChild(details);
  });

  contentEl.appendChild(groupEl);
});
</script>
</body>
